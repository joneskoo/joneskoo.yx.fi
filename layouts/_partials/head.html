<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ hugo.Generator }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="{{ "fonts/atkinson-hyperlegible-next-latin-400-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "fonts/oxanium-latin-500-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  {{ $desc := cond (and .IsPage (ne .Summary "")) (.Summary | plainify | htmlUnescape | truncate 160) site.Params.description }}
  <meta name="description" content="{{ $desc }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:image" content="{{ hugo.Data.me.photo | absURL }}">
  <meta name="twitter:card" content="summary">
  {{ with .OutputFormats.Get "RSS" }}
  <link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">
  {{ end }}
</head>
