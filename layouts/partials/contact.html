{{ with site.Data.me }}
<ul class="contact" aria-label="Yhteystiedot">
  <li><a href="mailto:{{ .email }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg>{{ .email }}</a></li>
  {{ with .githubUsername }}<li><a href="https://github.com/{{ . }}"><img src="{{ "img/icons/github.svg" | relURL }}" alt="" width="18" height="18">GitHub</a></li>{{ end }}
  {{ range .mastodon }}<li><a href="{{ .profile }}" rel="me"><img src="{{ "img/icons/mastodon.svg" | relURL }}" alt="" width="18" height="18">Mastodon</a></li>{{ end }}
  {{ with .signalLink }}<li><a href="{{ . }}"><img src="{{ "img/icons/signal.svg" | relURL }}" alt="" width="18" height="18">Signal</a></li>{{ end }}
  {{ with .linkedinUsername }}<li><a href="https://www.linkedin.com/in/{{ . }}"><img src="{{ "img/icons/linkedin.svg" | relURL }}" alt="" width="18" height="18">LinkedIn</a></li>{{ end }}
</ul>
{{ end }}
