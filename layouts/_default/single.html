{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}
  <main id="sisalto" class="wrapper">
    <article class="post">
      <header class="post__header">
        <h1>{{ .Title }}</h1>
        <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></p>
        {{ partial "tags.html" . }}
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </article>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
